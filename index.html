<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nari</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
    }


    /* HEADER */

    header {
      height: 100px;
      display: flex;
      align-items: center;
    }

    .name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }


    /* MAIN */

    main {
      padding-top: 40px;
      padding-bottom: 100px;
    }


    /* ACTIVITY */

    .activity {
      margin-bottom: 70px;
    }


    /* TITLE */

    .activity-title {
      padding-bottom: 12px;

      border-bottom: 1px solid #e5e5e5;

      font-size: 15px;
      font-weight: 600;
    }


    /* CONTENT */

    .activity-content {
      display: flex;
      align-items: center;

      gap: 32px;

      padding-top: 22px;
    }


    /* ACTIVITY IMAGE */

    .activity-image {
      width: 130px;
      height: 130px;

      flex-shrink: 0;

      border-radius: 10px;

      overflow: hidden;

      background: #f2f2f2;
    }

    .activity-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }


    /* SNS LINKS */

    .social-links {
      display: flex;
      flex-direction: column;

      min-width: 180px;
    }


    .social-link {
      display: flex;
      align-items: center;

      gap: 14px;

      padding: 12px 4px;

      border-bottom: 1px solid #eeeeee;

      font-size: 14px;

      transition: opacity 0.2s ease;
    }

    .social-link:first-child {
      border-top: 1px solid #eeeeee;
    }

    .social-link:hover {
      opacity: 0.5;
    }


    /* SNS LOGO */

    .social-link img {
      width: 18px;
      height: 18px;

      object-fit: contain;

      flex-shrink: 0;
    }


    /* ARROW */

    .arrow {
      margin-left: auto;

      color: #aaaaaa;

      font-size: 12px;
    }


    /* MOBILE */

    @media (max-width: 600px) {

      .container {
        width: calc(100% - 32px);
      }

      header {
        height: 76px;
      }

      .name {
        font-size: 18px;
      }

      main {
        padding-top: 30px;
      }

      .activity {
        margin-bottom: 55px;
      }

      .activity-title {
        font-size: 14px;
      }

      .activity-content {
        gap: 20px;

        padding-top: 18px;
      }

      .activity-image {
        width: 100px;
        height: 100px;

        border-radius: 8px;
      }

      .social-links {
        flex: 1;
        min-width: 0;
      }

      .social-link {
        gap: 10px;

        padding: 10px 2px;

        font-size: 13px;
      }

      .social-link img {
        width: 16px;
        height: 16px;
      }

    }

  </style>

</head>


<body>

  <div class="container">


    <!-- HEADER -->

    <header>

      <div class="name">
        Nari
      </div>

    </header>


    <main>


      <!-- ==================== -->
      <!-- ゲーム実況 -->
      <!-- ==================== -->

      <section class="activity">

        <div class="activity-title">
          ゲーム実況
        </div>


        <div class="activity-content">


          <!-- IMAGE -->

          <div class="activity-image">

            <img
              src="./narigame.png"
              alt="ゲーム実況"
            >

          </div>


          <!-- SNS -->

          <div class="social-links">


            <!-- X -->

            <a
              class="social-link"
              href="https://x.com/narigame"
              target="_blank"
              rel="noopener noreferrer"
            >

              <img
                src="./x.png"
                alt="X"
              >

              <span>
                X
              </span>

              <span class="arrow">
                ↗
              </span>

            </a>


            <!-- YOUTUBE -->

            <a
              class="social-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            >

              <img
                src="./youtube.png"
                alt="YouTube"
              >

              <span>
                YouTube
              </span>

              <span class="arrow">
                ↗
              </span>

            </a>


          </div>


        </div>

      </section>



      <!-- ==================== -->
      <!-- うゆ -->
      <!-- ==================== -->

      <section class="activity">

        <div class="activity-title">
          うゆ
        </div>


        <div class="activity-content">


          <div class="activity-image">
            <!-- 後で画像を追加 -->
          </div>


          <div class="social-links">


            <a
              class="social-link"
              href="https://x.com/planet_uyu"
              target="_blank"
              rel="noopener noreferrer"
            >

              <img
                src="./x.png"
                alt="X"
              >

              <span>
                X
              </span>

              <span class="arrow">
                ↗
              </span>

            </a>


          </div>


        </div>

      </section>



      <!-- ==================== -->
      <!-- 音楽 -->
      <!-- ==================== -->

      <section class="activity">

        <div class="activity-title">
          音楽
        </div>


        <div class="activity-content">


          <div class="activity-image">
            <!-- 後で画像を追加 -->
          </div>


          <div class="social-links">


            <a
              class="social-link"
              href="https://www.instagram.com/na__ir_/"
              target="_blank"
              rel="noopener noreferrer"
            >

              <img
                src="./Inatagram.png"
                alt="Instagram"
              >

              <span>
                Instagram
              </span>

              <span class="arrow">
                ↗
              </span>

            </a>


          </div>


        </div>

      </section>



      <!-- ==================== -->
      <!-- APP -->
      <!-- ==================== -->

      <section class="activity">

        <div class="activity-title">
          App
        </div>


        <div class="activity-content">


          <div class="activity-image">
            <!-- 後でPeppe Memoの画像 -->
          </div>


          <div class="social-links">


            <a
              class="social-link"
              href="#"
            >

              <span>
                App Store
              </span>

              <span class="arrow">
                ↗
              </span>

            </a>


          </div>


        </div>

      </section>


    </main>


  </div>

</body>

</html>
