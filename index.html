<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nari</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1000px, calc(100% - 40px));
      margin: 0 auto;
    }


    /* HEADER */

    header {
      height: 100px;
      display: flex;
      align-items: center;
    }

    .name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }


    /* MAIN */

    main {
      padding-top: 70px;
    }

    .title {
      margin-bottom: 32px;

      font-size: 13px;
      color: #888888;
    }


    /* ACTIVITIES */

    .activities {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 80px 60px;
    }

    .activity {
      display: block;
      width: 300px;
      max-width: 100%;
    }


    /* MAIN IMAGE */

    .activity-image {
      width: 300px;
      max-width: 100%;

      aspect-ratio: 1 / 1;

      overflow: hidden;

      border-radius: 12px;

      background: #f2f2f2;
    }

    .activity-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition: transform 0.3s ease;
    }

    .activity:hover .activity-image img {
      transform: scale(1.02);
    }


    /* INFO */

    .activity-info {
      display: flex;
      align-items: center;

      margin-top: 16px;
    }


    /* X LOGO */

    .platform {
      width: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    .platform img {
      width: 18px;
      height: 18px;

      object-fit: contain;

      display: block;
    }


    /* DIVIDER */

    .info-content {
      padding-left: 16px;

      border-left: 1px solid #dddddd;
    }


    /* TEXT */

    .activity-name {
      font-size: 15px;
      font-weight: 600;

      line-height: 1.3;
    }

    .activity-id {
      margin-top: 3px;

      font-size: 12px;

      color: #888888;
    }

    .activity-description {
      margin-top: 7px;

      font-size: 12px;
      line-height: 1.6;

      color: #666666;
    }


    /* FOOTER */

    footer {
      padding: 120px 0 30px;

      font-size: 12px;

      color: #aaaaaa;
    }


    /* MOBILE */

    @media (max-width: 700px) {

      .container {
        width: calc(100% - 32px);
      }

      header {
        height: 80px;
      }

      .name {
        font-size: 18px;
      }

      main {
        padding-top: 45px;
      }

      .activities {
        grid-template-columns: 1fr;

        gap: 60px;
      }

      .activity {
        width: 260px;
      }

      .activity-image {
        width: 260px;
      }

      .platform {
        width: 42px;
      }

      .platform img {
        width: 17px;
        height: 17px;
      }

      .info-content {
        padding-left: 14px;
      }

    }

  </style>

</head>


<body>

  <div class="container">


    <!-- HEADER -->

    <header>

      <div class="name">
        Nari
      </div>

    </header>


    <!-- MAIN -->

    <main>

      <div class="title">
        Activities
      </div>


      <div class="activities">


        <!-- eFootball -->

        <a
          class="activity"
          href="https://x.com/narigame"
          target="_blank"
          rel="noopener noreferrer"
        >


          <!-- PROFILE IMAGE -->

          <div class="activity-image">

            <img
              src="./narigame.png"
              alt="eFootball"
            >

          </div>


          <!-- ACCOUNT INFO -->

          <div class="activity-info">


            <!-- X LOGO -->

            <div class="platform">

              <img
                src="./x.png"
                alt="X"
              >

            </div>


            <!-- TEXT -->

            <div class="info-content">

              <div class="activity-name">
                eFootball
              </div>

              <div class="activity-id">
                @narigame
              </div>

              <div class="activity-description">
                選手情報やプレーについて発信
              </div>

            </div>


          </div>


        </a>



        <!-- Planet Uyu -->

        <a
          class="activity"
          href="https://x.com/planet_uyu"
          target="_blank"
          rel="noopener noreferrer"
        >

          <div class="activity-image">
          </div>

          <div class="activity-info">

            <div class="platform">

              <img
                src="./x.png"
                alt="X"
              >

            </div>

            <div class="info-content">

              <div class="activity-name">
                Planet Uyu
              </div>

              <div class="activity-id">
                @planet_uyu
              </div>

            </div>

          </div>

        </a>


      </div>

    </main>


    <!-- FOOTER -->

    <footer>
      Nari
    </footer>


  </div>

</body>

</html>
