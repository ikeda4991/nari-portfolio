<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nari</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }


    /* HEADER */

    header {
      height: 100px;
      display: flex;
      align-items: center;
    }

    .name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }


    /* MAIN */

    main {
      padding-top: 80px;
    }

    .title {
      font-size: 13px;
      color: #777777;
      margin-bottom: 24px;
    }


    /* ACTIVITIES */

    .activities {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px 28px;
    }

    .activity {
      display: block;
    }

    .image {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #f2f2f2;
      overflow: hidden;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .activity:hover img {
      transform: scale(1.02);
    }

    .activity-name {
      margin-top: 14px;
      font-size: 17px;
      font-weight: 600;
    }

    .activity-id {
      margin-top: 4px;
      font-size: 13px;
      color: #888888;
    }

    .activity-description {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.7;
      color: #555555;
      max-width: 450px;
    }


    /* FOOTER */

    footer {
      padding: 120px 0 30px;
      font-size: 12px;
      color: #aaaaaa;
    }


    /* MOBILE */

    @media (max-width: 700px) {

      .container {
        width: calc(100% - 28px);
      }

      header {
        height: 80px;
      }

      .name {
        font-size: 18px;
      }

      main {
        padding-top: 50px;
      }

      .activities {
        grid-template-columns: 1fr;
        gap: 48px;
      }

    }

  </style>
</head>


<body>

  <div class="container">


    <!-- HEADER -->

    <header>

      <div class="name">
        Nari
      </div>

    </header>


    <!-- ACTIVITIES -->

    <main>

      <div class="title">
        Activities
      </div>


      <div class="activities">


        <!-- eFootball -->

        <a
          class="activity"
          href="https://x.com/narigame"
          target="_blank"
          rel="noopener noreferrer"
        >

          <div class="image">

            <img
              src="./narigame.png"
              alt="eFootball"
            >

          </div>

          <div class="activity-name">
            eFootball
          </div>

          <div class="activity-id">
            @narigame
          </div>

          <div class="activity-description">
            eFootballの選手情報やプレーについて発信しています。
          </div>

        </a>


        <!-- Planet Uyu -->

        <a
          class="activity"
          href="https://x.com/planet_uyu"
          target="_blank"
          rel="noopener noreferrer"
        >

          <div class="image">
          </div>

          <div class="activity-name">
            Planet Uyu
          </div>

          <div class="activity-id">
            @planet_uyu
          </div>

        </a>


        <!-- Peppe Memo -->

        <div class="activity">

          <div class="image">
          </div>

          <div class="activity-name">
            Peppe Memo
          </div>

          <div class="activity-id">
            App
          </div>

        </div>


        <!-- Music -->

        <div class="activity">

          <div class="image">
          </div>

          <div class="activity-name">
            Music
          </div>

        </div>


      </div>

    </main>


    <!-- FOOTER -->

    <footer>
      Nari
    </footer>


  </div>

</body>

</html>
