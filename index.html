<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nari</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .social-links a {
      font-size: 14px;
      color: #666666;
    }

    .social-links a:hover {
      color: #111111;
    }

    main {
      padding-top: 80px;
    }

    .title {
      font-size: 13px;
      color: #777777;
      margin-bottom: 24px;
    }

    .works {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 60px 28px;
    }

    .work {
      display: block;
    }

    .image {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #f2f2f2;
    }

    .work-name {
      margin-top: 13px;
      font-size: 16px;
      font-weight: 500;
    }

    footer {
      padding: 120px 0 30px;
      font-size: 12px;
      color: #aaaaaa;
    }

    @media (max-width: 700px) {

      .container {
        width: calc(100% - 28px);
      }

      header {
        min-height: 80px;
      }

      .name {
        font-size: 18px;
      }

      .social-links {
        gap: 14px;
      }

      .social-links a {
        font-size: 12px;
      }

      .social-links .username {
        display: none;
      }

      main {
        padding-top: 50px;
      }

      .works {
        grid-template-columns: 1fr;
        gap: 45px;
      }
    }
  </style>

</head>


<body>

  <div class="container">

    <header>

      <div class="name">
        Nari
      </div>

      <nav class="social-links">

        <a
          href="https://x.com/narigame"
          target="_blank"
          rel="noopener noreferrer"
        >
          X <span class="username">@narigame</span>
        </a>

        <a
          href="https://x.com/planet_uyu"
          target="_blank"
          rel="noopener noreferrer"
        >
          X <span class="username">@planet_uyu</span>
        </a>

        <a
          href="https://www.instagram.com/na__ir_/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram <span class="username">@na__ir_</span>
        </a>

      </nav>

    </header>


    <main>

      <div class="title">
        Works
      </div>

      <div class="works">

        <a class="work" href="#">
          <div class="image"></div>
          <div class="work-name">eFootball</div>
        </a>

        <a class="work" href="#">
          <div class="image"></div>
          <div class="work-name">Peppe Memo</div>
        </a>

        <a class="work" href="#">
          <div class="image"></div>
          <div class="work-name">Music</div>
        </a>

        <a class="work" href="#">
          <div class="image"></div>
          <div class="work-name">Visual</div>
        </a>

      </div>

    </main>


    <footer>
      Nari
    </footer>

  </div>

</body>

</html>
