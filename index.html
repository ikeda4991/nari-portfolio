<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nari</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* HEADER */

    header {
      height: 100px;
      display: flex;
      align-items: center;
    }

    .name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    /* MAIN */

    main {
      padding-top: 70px;
    }

    .title {
      margin-bottom: 32px;
      font-size: 13px;
      color: #888888;
    }

    /* ACTIVITIES */

    .activities {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 64px 28px;
    }

    .activity {
      display: block;
      min-width: 0;
    }

    /* IMAGE */

    .activity-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 12px;
      background: #f2f2f2;
    }

    .activity-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .activity:hover .activity-image img {
      transform: scale(1.02);
    }

    /* INFO */

    .activity-info {
      display: flex;
      align-items: center;
      margin-top: 14px;
      min-height: 60px;
    }

    .platform {
      width: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .platform img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      display: block;
    }

    .info-content {
      padding-left: 14px;
      border-left: 1px solid #dddddd;
      min-width: 0;
    }

    .activity-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    .activity-id {
      margin-top: 3px;
      font-size: 12px;
      color: #888888;
    }

    .activity-description {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.5;
      color: #666666;
    }

    /* FOOTER */

    footer {
      padding: 120px 0 30px;
      font-size: 12px;
      color: #aaaaaa;
    }

    /* SMARTPHONE */

    @media (max-width: 700px) {

      .container {
        width: calc(100% - 24px);
      }

      header {
        height: 76px;
      }

      .name {
        font-size: 18px;
      }

      main {
        padding-top: 40px;
      }

      .title {
        margin-bottom: 22px;
      }

      .activities {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 40px 12px;
      }

      .activity-image {
        border-radius: 9px;
      }

      .activity-info {
        align-items: flex-start;
        margin-top: 10px;
        min-height: 54px;
      }

      .platform {
        width: 30px;
      }

      .platform img {
        width: 14px;
        height: 14px;
        margin-top: 2px;
      }

      .info-content {
        padding-left: 9px;
      }

      .activity-name {
        font-size: 13px;
      }

      .activity-id {
        font-size: 10px;
      }

      .activity-description {
        margin-top: 4px;
        font-size: 10px;
        line-height: 1.45;
      }
    }
  </style>

</head>


<body>

  <div class="container">

    <header>
      <div class="name">
        Nari
      </div>
    </header>


    <main>

      <div class="title">
        Activities
      </div>


      <div class="activities">


        <!-- eFootball -->

        <a
          class="activity"
          href="https://x.com/narigame"
          target="_blank"
          rel="noopener noreferrer"
        >

          <div class="activity-image">
            <img
              src="./narigame.png"
              alt="eFootball"
            >
          </div>

          <div class="activity-info">

            <div class="platform">
              <img
                src="./x.png"
                alt="X"
              >
            </div>

            <div class="info-content">

              <div class="activity-name">
                Nari
              </div>

              <div class="activity-id">
                @narigame
              </div>

              <div class="activity-description">
                ゲームに関する投稿が中心です
              </div>

            </div>

          </div>

        </a>


        <!-- Planet Uyu -->

        <a
          class="activity"
          href="https://x.com/planet_uyu"
          target="_blank"
          rel="noopener noreferrer"
        >

          <div class="activity-image">
          </div>

          <div class="activity-info">

            <div class="platform">
              <img
                src="./x.png"
                alt="X"
              >
            </div>

            <div class="info-content">

              <div class="activity-name">
                うゆ
              </div>

              <div class="activity-id">
                @planet_uyu
              </div>

            </div>

          </div>

        </a>


        <!-- Peppe Memo -->

        <div class="activity">

          <div class="activity-image">
          </div>

          <div class="activity-info">

            <div class="info-content">

              <div class="activity-name">
                Nari
              </div>

              <div class="activity-id">
                App
              </div>

            </div>

          </div>

        </div>


        <!-- Music -->

        <div class="activity">

          <div class="activity-image">
          </div>

          <div class="activity-info">

            <div class="info-content">

              <div class="activity-name">
                Music
              </div>

            </div>

          </div>

        </div>


      </div>

    </main>


    <footer>
      Nari
    </footer>

  </div>

</body>

</html>
