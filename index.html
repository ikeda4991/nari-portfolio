<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nari</title>

  <style>
    /* =========================
       BASE
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      height: 100px;
      display: flex;
      align-items: center;
    }

    .name {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.04em;
    }


    /* =========================
       MAIN
    ========================= */

    main {
      padding-top: 40px;
      padding-bottom: 100px;
    }


    /* =========================
       ACTIVITY
    ========================= */

    .activity {
      margin-bottom: 70px;
    }

    .activity-title {
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e5e5;

      font-size: 15px;
      font-weight: 600;
    }

    .activity-content {
      display: flex;
      align-items: center;
      gap: 32px;

      padding-top: 22px;
    }


    /* Activity Image */

    .activity-image {
      width: 130px;
      height: 130px;

      flex-shrink: 0;
      overflow: hidden;

      border-radius: 10px;
      background: #f2f2f2;
    }

    .activity-image img {
      width: 100%;
      height: 100%;

      display: block;
      object-fit: cover;
    }


    /* =========================
       SOCIAL LINKS
    ========================= */

    .social-links {
      display: flex;
      flex-direction: column;

      width: 240px;
      max-width: 100%;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 14px;

      padding: 12px 4px;
      border-bottom: 1px solid #eeeeee;

      font-size: 14px;

      transition: opacity 0.2s ease;
    }

    .social-link:first-child {
      border-top: 1px solid #eeeeee;
    }

    .social-link:hover {
      opacity: 0.5;
    }


    /* Social Icons */

    .social-link img {
      width: 18px;
      height: 18px;

      flex-shrink: 0;
      object-fit: contain;
    }

    .social-link img[alt="YouTube"] {
      transform: scale(1.55);
    }


    /* Arrow */

    .arrow {
      margin-left: auto;

      color: #aaaaaa;
      font-size: 12px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .container {
        width: calc(100% - 32px);
      }

      header {
        height: 76px;
      }

      .name {
        font-size: 18px;
      }

      main {
        padding-top: 30px;
      }

      .activity {
        margin-bottom: 55px;
      }

      .activity-title {
        font-size: 14px;
      }

      .activity-content {
        gap: 20px;
        padding-top: 18px;
      }

      .activity-image {
        width: 100px;
        height: 100px;

        border-radius: 8px;
      }

      .social-links {
        flex: 1;
        min-width: 0;
      }

      .social-link {
        gap: 10px;

        padding: 10px 2px;

        font-size: 12px;
      }

      .social-link img {
        width: 16px;
        height: 16px;
      }
    }
  </style>
</head>


<body>

  <div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <header>
      <div class="name">Nari</div>
    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main>


      <!-- MUSIC -->

      <section class="activity">

        <div class="activity-title">
          Music
        </div>

        <div class="activity-content">

          <div class="activity-image">
          </div>

          <div class="social-links">

            <a
              class="social-link"
              href="https://www.instagram.com/na__ir_/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="./instagram.png"
                alt="Instagram"
              >

              <span>@na__ir_</span>

              <span class="arrow">↗</span>
            </a>

          </div>

        </div>

      </section>


      <!-- COMICS -->

      <section class="activity">

        <div class="activity-title">
          Comics
        </div>

        <div class="activity-content">

          <div class="activity-image">
            <img
              src="./planet_uyu.png"
              alt="Comics"
            >
          </div>

          <div class="social-links">

            <a
              class="social-link"
              href="https://x.com/planet_uyu"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="./x.png"
                alt="X"
              >

              <span>@planet_uyu</span>

              <span class="arrow">↗</span>
            </a>

          </div>

        </div>

      </section>


      <!-- GAMING -->

      <section class="activity">

        <div class="activity-title">
          Gaming
        </div>

        <div class="activity-content">

          <div class="activity-image">
            <img
              src="./narigame.png"
              alt="Gaming"
            >
          </div>

          <div class="social-links">


            <!-- X -->

            <a
              class="social-link"
              href="https://x.com/narigame"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="./x.png"
                alt="X"
              >

              <span>@narigame</span>

              <span class="arrow">↗</span>
            </a>


            <!-- YOUTUBE -->

            <a
              class="social-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="./youtube.png"
                alt="YouTube"
              >

              <span>準備中</span>

              <span class="arrow">↗</span>
            </a>


          </div>

        </div>

      </section>


    </main>

  </div>

</body>

</html>
